import groovy.json.JsonOutput
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('publicationDependencies') {
        doLast {
            def items = app.configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { a ->
                [id: a.moduleVersion.id.toString(), file: a.file.name,
                 sha256: java.security.MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex().toString()]
            }.sort { it.id }
            def target = new File(gradle.rootProject.projectDir, 'legal/android-dependencies.json')
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(items))
            println "Production runtime artifacts: ${items.size()}"
        }
    }
}
